# Builda o app Vite e publica no GitHub Pages
name: Deploy static content to Pages

on:
  # Roda em push na branch padrão
  push:
    branches: ["main"]

  # Permite rodar manualmente na aba Actions
  workflow_dispatch:

# Permissões do GITHUB_TOKEN para deploy no Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela um em andamento
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Valida a config do Supabase antes de buildar
        # O Vite inlina as VITE_* no bundle em tempo de build. Se faltarem, o
        # build passa silenciosamente e o app publicado monta as URLs como
        # `https://.supabase.co/...` — host inexistente, e TODA integração
        # (typeahead do LinkedIn, campanhas, analytics, IA) falha sem alarde.
        # Falhar aqui é melhor que publicar um app mudo.
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          if [ -z "$VITE_SUPABASE_PROJECT_ID" ]; then missing="$missing VITE_SUPABASE_PROJECT_ID"; fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then missing="$missing VITE_SUPABASE_ANON_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::Secrets ausentes:$missing — cadastre em Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Config do Supabase presente."
          # Não bloqueia o build: sem a chave os logos degradam para avatar de
          # letra, o resto do app funciona. Mas avisa, porque a falha é muda.
          if [ -z "${{ secrets.VITE_LOGO_DEV_KEY }}" ]; then
            echo "::warning::VITE_LOGO_DEV_KEY ausente — os logos das empresas não serão exibidos."
          fi

      - name: Build
        env:
          # Faz o Vite emitir os assets com base '/maestro-unificado/'
          GITHUB_PAGES: "true"
          # Chave anon e project id são públicos por design (rodam no browser);
          # ficam em secrets só para não versionar credencial no repo.
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Chave publicável do logo.dev, usada no browser para os logos das
          # empresas-alvo. Sem ela o bundle saía com `?token=undefined`.
          VITE_LOGO_DEV_KEY: ${{ secrets.VITE_LOGO_DEV_KEY }}
        run: npm run build

      - name: Confirma que a config entrou no bundle
        # Defesa em profundidade: se o inline falhar por qualquer motivo, o
        # deploy para aqui em vez de publicar o app quebrado de novo.
        # Nota: o minificador NÃO resolve `https://${x}.supabase.co` — ele mantém
        # o template e o `const x="..."` separados. Por isso a checagem é pela
        # presença do project id no bundle, não pelo formato da URL.
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          if ! grep -rqF "$VITE_SUPABASE_PROJECT_ID" dist/assets/*.js; then
            echo "::error::O project id do Supabase não foi inlinado no bundle — o app publicado não alcançaria o backend."
            exit 1
          fi
          echo "Bundle com config do Supabase resolvida."

      - name: SPA fallback (deep-links não dão 404)
        # O app usa BrowserRouter; o Pages não sabe reescrever /uso-clientes para
        # o index.html. Copiar index.html -> 404.html faz o Pages servir a SPA
        # em qualquer rota, e o React Router assume a partir daí.
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publica só o resultado do build, não o repositório inteiro
          path: 'dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
